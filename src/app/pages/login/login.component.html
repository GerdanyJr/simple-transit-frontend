<h1>Login</h1>
<form (ngSubmit)="submit()" [formGroup]="loginForm">
  <mat-card-content>
    <mat-form-field>
      <mat-label>Usuário</mat-label>
      <input matInput formControlName="login" />
      @if (loginForm.get("login")?.hasError("required")) {
        <mat-error>Usuário é um campo obrigatório</mat-error>
      }
    </mat-form-field>
    <mat-form-field>
      <mat-label>Senha</mat-label>
      <input matInput type="password" formControlName="password" />
      @if (loginForm.get("password")?.hasError("required")) {
        <mat-error>Senha é um campo obrigatório</mat-error>
      }
      @if (loginForm.get("password")?.hasError("minlength")) {
        <mat-error>Senha precisa ter no mínimo 5 dígitos</mat-error>
      }
    </mat-form-field>
  </mat-card-content>
  <mat-card-actions [align]="'end'">
    <button mat-button extended routerLink="/auth/signup">Inscreva-se</button>
    <button mat-fab extended [disabled]="loginForm.invalid">Login</button>
  </mat-card-actions>
</form>
