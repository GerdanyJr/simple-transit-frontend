@if (!isLoading()) {
  <div class="grid-container">
    <mat-grid-list cols="2" rowHeight="400px">
      <mat-grid-tile [colspan]="1" [rowspan]="1">
        <mat-card class="dashboard-card">
          <mat-card-header>
            <mat-card-title> Ocorrências por tipo </mat-card-title>
          </mat-card-header>
          <mat-card-content class="dashboard-card-content">
            <canvas
              baseChart
              width="300px"
              height="300px"
              [type]="'pie'"
              [datasets]="[pageData()?.pie?.dataset!]"
              [labels]="pageData()?.pie?.ocurrencyNames"
              [options]="pieChartOptions"
              [legend]="pieChartLegend">
            </canvas>
          </mat-card-content>
        </mat-card>
      </mat-grid-tile>

      <mat-grid-tile [colspan]="2" [rowspan]="1">
        <mat-card class="dashboard-card">
          <mat-card-header>
            <mat-card-title>
              Meses com maior número de incidências
            </mat-card-title>
          </mat-card-header>
          <mat-card-content class="dashboard-card-content-2">
            <canvas
              baseChart
              width="1200px"
              height="300px"
              [data]="pageData()?.bar"
              [options]="barChartOptions"
              [legend]="false"
              [type]="'bar'">
            </canvas>
          </mat-card-content>
        </mat-card>
      </mat-grid-tile>
    </mat-grid-list>
  </div>
} @else {
  <mat-spinner diameter="50" />
}
